name: Build ODA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: oda_hud
        run: flutter pub get

      - name: Analyze
        working-directory: oda_hud
        run: flutter analyze

      - name: Build APK
        working-directory: oda_hud
        run: flutter build apk --release

      - name: Prepare release files
        run: |
          VERSION="${GITHUB_SHA}"
          APK="oda_hud/build/app/outputs/flutter-apk/app-release.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          mkdir -p release

          cp "$APK" "release/oda-${VERSION}.apk"

          cat > release/update.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/oda-${VERSION}.apk",
            "sha256": "${SHA256}",
            "channel": "stable"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.sha }}
          name: ODA ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/oda-*.apk
            release/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oda-hud-release
          path: oda_hud/build/app/outputs/flutter-apk/app-release.apk
