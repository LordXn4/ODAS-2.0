name: Build ODA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: oda_hud
        run: flutter pub get

      - name: Analyze
        working-directory: oda_hud
        run: flutter analyze

      - name: Build APK
        working-directory: oda_hud
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oda-hud-release
          path: oda_hud/build/app/outputs/flutter-apk/app-release.apk
