name: Build ODA HUD APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oda_hud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --debug

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hud-${{ github.run_number }}
          name: ODA HUD ${{ github.run_number }}
          body: |
            ODA HUD 3D
            Build automático do projeto ODAS-2.0.
          files: oda_hud/build/app/outputs/flutter-apk/app-debug.apk
          make_latest: true
